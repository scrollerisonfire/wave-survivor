<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wave Survivor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="wrap">
      <div id="hud">
        <div class="bars">
          <div class="bar" id="hp"><i></i></div>
          <div class="bar" id="xp"><i></i></div>
        </div>
        <div class="stats">
          <span>Wave <b id="wv">1</b></span>
          <span>Kills <b id="kl">0</b></span>
          <span><b id="fps">60</b> fps</span>
        </div>
      </div>
      <div id="banner"></div>
      <div id="ov"></div>
    </div>
    <div id="foot">Move: WASD / arrows / drag. Auto-fire. Upgrades: click or press 1-3.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
